# vLLM inference server on the GPU pool, with a Service and a ServiceMonitor.
# vLLM exposes Prometheus metrics at /metrics; the dashboards and alerts use them.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: inference-vllm
  namespace: rag
  labels:
    app.kubernetes.io/name: inference-vllm
spec:
  replicas: 1                      # budget: one GPU replica. Scale only for real demand.
  selector:
    matchLabels:
      app.kubernetes.io/name: inference-vllm
  template:
    metadata:
      labels:
        app.kubernetes.io/name: inference-vllm
    spec:
      nodeSelector:
        workload: gpu
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      containers:
        - name: vllm
          image: vllm/vllm-openai:latest   # pin a version tag before production use
          args:
            - --model=Qwen/Qwen2.5-7B-Instruct
            - --served-model-name=srag-answer
            - --max-model-len=8192
            - --gpu-memory-utilization=0.90
            - --port=8000
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: HF_HOME
              value: /cache/hf
          resources:
            limits:
              nvidia.com/gpu: 1
              memory: 32Gi
            requests:
              cpu: "4"
              memory: 24Gi
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 120
            periodSeconds: 10
          volumeMounts:
            - name: cache
              mountPath: /cache
            - name: dshm
              mountPath: /dev/shm
      volumes:
        - name: cache
          emptyDir:
            sizeLimit: 60Gi
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 8Gi
---
apiVersion: v1
kind: Service
metadata:
  name: inference-vllm
  namespace: rag
  labels:
    app.kubernetes.io/name: inference-vllm
spec:
  selector:
    app.kubernetes.io/name: inference-vllm
  ports:
    - name: http
      port: 8000
      targetPort: http
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: inference-vllm
  namespace: rag
  labels:
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: inference-vllm
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
