# Values for the NVIDIA DCGM exporter. It must run on GPU nodes, so it tolerates the GPU taint.

serviceMonitor:
  enabled: true          # creates a ServiceMonitor that kube-prometheus-stack scrapes
  interval: 30s

nodeSelector:
  workload: gpu

tolerations:
  - key: nvidia.com/gpu
    operator: Exists
    effect: NoSchedule

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    memory: 256Mi
