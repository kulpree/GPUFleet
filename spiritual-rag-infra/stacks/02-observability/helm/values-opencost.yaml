# Values for OpenCost. It reads metrics from the kube-prometheus-stack Prometheus.

opencost:
  exporter:
    defaultClusterId: spiritual-rag-primary
  prometheus:
    internal:
      enabled: true
      namespaceName: monitoring
      serviceName: kube-prometheus-stack-prometheus
      port: 9090
  ui:
    enabled: false           # Cost metrics are shown in the Grafana Cost dashboard instead

# NOTE: OpenCost prices nodes from cloud list prices. Nebius rates differ, so set
# custom pricing (see docs/opencost.md) or treat node_total_hourly_cost as an estimate.
